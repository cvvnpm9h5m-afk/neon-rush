<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Neon Rush 3D v3.0.1</title><style>*{box-sizing:border-box}body{margin:0;background:#080b1f;color:white;font:16px system-ui;overflow:hidden;touch-action:none}canvas{display:block}#hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;text-shadow:0 2px 5px #000;pointer-events:none}#menu{position:fixed;inset:0;display:grid;place-items:center;background:#080a1ad9}#card{background:#151632;border:1px solid #8a5bff;padding:28px;border-radius:20px;text-align:center;max-width:340px}h1{color:#5deaff;margin:0}button{border:0;border-radius:12px;background:#41dcf1;color:#071126;font-weight:bold;padding:14px 22px;font-size:17px}#controls{position:fixed;bottom:22px;left:15px;right:15px;display:flex;justify-content:space-between}#controls button{background:#233a6bc9;color:white;border:1px solid #66dfff;padding:14px}#controls div{display:flex;gap:8px}small{color:#b8b8df}</style></head><body><div id="hud"><span>PUNTOS <b id="score">0</b></span><span>🟡 <b id="coins">0</b></span><span>RÉCORD <b id="best">0</b></span></div><div id="controls"><div><button id="left">◀</button><button id="right">▶</button></div><div><button id="down">▼</button><button id="up">▲</button></div></div><div id="menu"><div id="card"><h1>NEON RUSH 3D</h1><h3>Versión 3.0.1</h3><p id="message">Cargando personaje 3D…</p><button id="play" disabled style="opacity:.55">CARGANDO…</button><p><small>Desliza: izquierda / derecha / arriba / abajo</small></p></div></div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script><script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const $=x=>document.querySelector(x), scene=new THREE.Scene();scene.background=new THREE.Color(0x090b23);scene.fog=new THREE.FogExp2(0x090b23,.013);
const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,250);camera.position.set(0,4.3,10.6);camera.lookAt(0,1.2,-15);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0x9bcaff,0x19102e,2));const light=new THREE.DirectionalLight(0xffd1ee,2.5);light.position.set(-4,9,7);scene.add(light);
const road=new THREE.Mesh(new THREE.BoxGeometry(10,.15,260),new THREE.MeshStandardMaterial({color:0x111b38,roughness:.6}));road.position.z=-105;road.position.y=-.12;scene.add(road);
const laneWidth=2.7;for(let i=-1;i<=1;i++){const edge=new THREE.Mesh(new THREE.BoxGeometry(.07,.035,260),new THREE.MeshBasicMaterial({color:i===0?0x445588:0xff33a9}));edge.position.set(i===0?0:Math.sign(i)*4.9,.01,-105);scene.add(edge)}
let marks=[];for(let z=-180;z<12;z+=8)for(let x of [-laneWidth/2,laneWidth/2]){const m=new THREE.Mesh(new THREE.BoxGeometry(.07,.02,3),new THREE.MeshBasicMaterial({color:0x59edff}));m.position.set(x,.03,z);scene.add(m);marks.push(m)}
let buildings=[];for(let i=0;i<85;i++){let side=i%2?-1:1,z=-i*3.3;let h=3+(i*17%9);const m=new THREE.Mesh(new THREE.BoxGeometry(2.5,h,2.5),new THREE.MeshStandardMaterial({color:i%3?0x1c2353:0x331c55,emissive:i%4?0x080c21:0x200928}));m.position.set(side*(8+(i%3)*2),h/2-.2,z);scene.add(m);buildings.push(m)}
const player=new THREE.Group();player.position.set(0,0,2);scene.add(player);let mixer=null,hero=null,ready=false;
new GLTFLoader().load('./heroine.glb',g=>{hero=g.scene;hero.scale.setScalar(.95);hero.rotation.y=Math.PI;player.add(hero);if(g.animations.length){mixer=new THREE.AnimationMixer(hero);mixer.clipAction(g.animations[0]).play()}ready=true;$('#message').textContent='Heroína 3D animada lista';$('#play').disabled=false;$('#play').style.opacity='1';$('#play').textContent='JUGAR';},undefined,e=>{$('#message').textContent='Error al cargar heroine.glb. Comprueba que esté junto a index.html y vuelve a abrir la página.';$('#play').textContent='ERROR DE CARGA';console.error(e)});
const obstacleMat=new THREE.MeshStandardMaterial({color:0xff4775,emissive:0x8b0735,metalness:.3}),coinMat=new THREE.MeshStandardMaterial({color:0xffce36,emissive:0x885000,metalness:.65,roughness:.2});
let playing=false,lane=0,score=0,coins=0,best=Number(localStorage.getItem('neonBest3d')||0),speed=18,elapsed=0,spawn=.8,items=[],jump=0,vel=0,slide=0,prev=performance.now();$('#best').textContent=best;
function start(){if(!ready){$('#message').textContent='El personaje todavía se está cargando. Espera unos segundos.';return;}items.forEach(i=>scene.remove(i.mesh));items=[];lane=0;score=coins=elapsed=jump=vel=slide=0;speed=18;spawn=.8;playing=true;$('#menu').style.display='none';player.position.set(0,0,2);hero.scale.y=.95}
function move(n){if(playing)lane=Math.max(-1,Math.min(1,lane+n))}function up(){if(playing&&jump===0&&slide===0)vel=9}function down(){if(playing&&jump===0)slide=.75}
$('#play').onclick=start;$('#left').onclick=()=>move(-1);$('#right').onclick=()=>move(1);$('#up').onclick=up;$('#down').onclick=down;
addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft'||e.key==='a')move(-1);if(e.key==='ArrowRight'||e.key==='d')move(1);if(e.key==='ArrowUp'||e.key===' ')up();if(e.key==='ArrowDown')down();if(e.key==='Enter'&&!playing)start()});let sx,sy;renderer.domElement.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});renderer.domElement.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<25)return;if(Math.abs(dx)>Math.abs(dy))move(Math.sign(dx));else dy<0?up():down()},{passive:true});
function create(){const l=Math.floor(Math.random()*3)-1,kind=Math.random()<.3?'coin':Math.random()<.5?'low':'high';const mesh=kind==='coin'?new THREE.Mesh(new THREE.TorusGeometry(.35,.12,8,16),coinMat):new THREE.Mesh(new THREE.BoxGeometry(1.6,kind==='low'?.85:2.25,.85),obstacleMat);mesh.position.set(l*laneWidth,kind==='coin'?1.1:kind==='low'?.43:1.12,-105);scene.add(mesh);items.push({mesh,l,kind,hit:false});}
function lose(){playing=false;best=Math.max(best,Math.floor(score));localStorage.setItem('neonBest3d',best);$('#best').textContent=best;$('#message').textContent=`${Math.floor(score)} puntos · ${coins} monedas`;$('#play').textContent='VOLVER A JUGAR';$('#menu').style.display='grid'}
function tick(now){requestAnimationFrame(tick);let dt=Math.min(.05,(now-prev)/1000);prev=now;if(mixer&&playing)mixer.update(dt*1.5);if(playing){elapsed+=dt;speed=Math.min(40,18+elapsed*.28);score+=speed*dt;spawn-=dt;if(spawn<=0){create();spawn=Math.max(.65,1.6-elapsed*.008)}player.position.x+=(lane*laneWidth-player.position.x)*Math.min(1,dt*12);if(jump>0||vel>0){jump+=vel*dt;vel-=23*dt;if(jump<0){jump=0;vel=0}}player.position.y=jump;slide=Math.max(0,slide-dt);if(hero)hero.scale.y=slide>0?.62:.95;
for(const m of marks){m.position.z+=speed*dt;if(m.position.z>12)m.position.z-=192}
for(const o of items){o.mesh.position.z+=speed*dt;if(o.kind==='coin')o.mesh.rotation.y+=dt*4;if(!o.hit&&o.mesh.position.z>1&&o.mesh.position.z<3.1&&o.l===lane){o.hit=true;if(o.kind==='coin'){coins++;score+=25;scene.remove(o.mesh)}else if(o.kind==='low'&&jump>1.05){}else if(o.kind==='high'&&slide>0){}else{lose();break}}}items=items.filter(o=>{if(o.mesh.position.z>15){scene.remove(o.mesh);return false}return true});$('#score').textContent=Math.floor(score);$('#coins').textContent=coins}renderer.render(scene,camera)}requestAnimationFrame(tick);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
