<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#090c23"><title>Neon Rush 3D v2.2</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07091c;color:#fff;font-family:system-ui,-apple-system,sans-serif;touch-action:none}canvas{display:block;width:100%;height:100%}#hud{position:fixed;top:env(safe-area-inset-top);left:0;right:0;display:flex;justify-content:space-between;padding:14px 18px;pointer-events:none;text-shadow:0 2px 8px #000}#hud b{font-size:23px}#hud small{display:block;color:#a9c3e8;font-size:11px;letter-spacing:2px}.panel{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#070a22bb,#06081eea);padding:24px}.card{width:min(440px,100%);padding:28px 22px;border:1px solid #3d68a5;border-radius:24px;background:#101632e8;box-shadow:0 0 65px #00bfff22;text-align:center}.logo{font-size:clamp(35px,10vw,55px);font-weight:1000;line-height:1;letter-spacing:-2px;color:#6efaff;text-shadow:0 0 24px #00bfff}h2{margin:15px 0 8px}p{color:#c2c9e2;line-height:1.5}button{background:linear-gradient(110deg,#00d9ef,#8a5bff);border:0;color:#051024;border-radius:14px;font-weight:900;font-size:17px;padding:16px 30px;min-height:54px;cursor:pointer}#controls{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:space-between;padding:0 18px;pointer-events:none}#controls button{pointer-events:auto;min-width:65px;padding:10px 12px;background:#162b58aa;border:1px solid #75dafa88;color:white;backdrop-filter:blur(8px);font-size:22px}#controls .group{display:flex;gap:10px}#mute{position:fixed;right:16px;top:calc(88px + env(safe-area-inset-top));z-index:3;background:#122345bb;border:1px solid #6ac8f588;color:white;font-size:19px;padding:8px 12px;min-height:0}#toast{position:fixed;top:24%;width:100%;text-align:center;font-size:25px;font-weight:900;text-shadow:0 2px 10px #000;pointer-events:none} .hidden{display:none!important}#footer{position:fixed;bottom:calc(94px + env(safe-area-inset-bottom));width:100%;text-align:center;font-size:11px;color:#a9b3d1;pointer-events:none}</style></head><body><canvas id="game"></canvas><div id="hud"><div><small>PUNTOS</small><b id="score">0</b></div><div style="text-align:center"><small>MONEDAS</small><b id="coins">🟡 0</b></div><div style="text-align:right"><small>RÉCORD</small><b id="best">0</b></div></div><button id="mute" aria-label="Activar o desactivar sonido">🔊</button><div id="toast"></div><div id="controls"><div class="group"><button id="left" aria-label="Izquierda">◀</button><button id="right" aria-label="Derecha">▶</button></div><div class="group"><button id="down" aria-label="Deslizar">▼</button><button id="up" aria-label="Saltar">▲</button></div></div><div id="footer">Desliza para moverte · ▲ Saltar · ▼ Deslizar</div><div id="overlay" class="panel"><div class="card"><div class="logo">NEON<br>RUSH <span style="color:#f36bff">3D</span></div><div style="display:inline-block;margin:14px 0 3px;padding:6px 15px;border:1px solid #6efaff88;border-radius:999px;background:#00d9ef16;color:#b8faff;font-size:13px;font-weight:800;letter-spacing:2px">VERSIÓN 2.2</div><p>Corre por la ciudad del futuro, esquiva obstáculos y recoge monedas.</p><p>↔ Cambia de carril &nbsp; ↑ Salta &nbsp; ↓ Deslízate</p><button id="start">▶ JUGAR</button><p style="font-size:12px">Récord local · Efectos de sonido · Compatible con móviles</p></div></div><script>
(()=>{'use strict';const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),$=s=>document.querySelector(s);let W=0,H=0,dpr=1;function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();let state='menu',score=0,coins=0,best=Number(localStorage.getItem('neonRush3dBest')||0),lane=0,visualLane=0,jump=0,vy=0,slide=0,objects=[],spawn=0,speed=20,dist=0,last=0,muted=false,audio=null,shake=0,flash=0;$('#best').textContent=best;const rand=(a,b)=>a+Math.random()*(b-a);function sound(f=440,d=.1,type='sine',vol=.06){if(muted)return;try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(f,audio.currentTime);o.frequency.exponentialRampToValueAtTime(Math.max(60,f*.65),audio.currentTime+d);g.gain.setValueAtTime(vol,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch(e){}}function start(){score=coins=dist=0;speed=20;lane=visualLane=0;jump=vy=slide=0;objects=[];spawn=.4;state='playing';$('#overlay').classList.add('hidden');sound(600,.15);updateHud()}function updateHud(){$('#score').textContent=Math.floor(score);$('#coins').textContent='🟡 '+coins;$('#best').textContent=best}function move(dir){if(state!=='playing')return;lane=Math.max(-1,Math.min(1,lane+dir));sound(260,.055,'triangle',.025)}function hop(){if(state==='playing'&&jump===0&&slide<=0){vy=9.5;sound(540,.18,'sine',.05)}}function duck(){if(state==='playing'&&jump===0){slide=.8;sound(180,.1,'triangle',.04)}}$('#start').onclick=start;$('#mute').onclick=()=>{muted=!muted;$('#mute').textContent=muted?'🔇':'🔊'};$('#left').onclick=()=>move(-1);$('#right').onclick=()=>move(1);$('#up').onclick=hop;$('#down').onclick=duck;addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' ','a','d','w','s'].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft'||e.key==='a')move(-1);if(e.key==='ArrowRight'||e.key==='d')move(1);if(e.key==='ArrowUp'||e.key==='w'||e.key===' ')hop();if(e.key==='ArrowDown'||e.key==='s')duck();if(e.key==='Enter'&&state!=='playing')start()});let sx=0,sy=0;canvas.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});canvas.addEventListener('touchend',e=>{const x=e.changedTouches[0].clientX-sx,y=e.changedTouches[0].clientY-sy;if(Math.max(Math.abs(x),Math.abs(y))<25)return;if(Math.abs(x)>Math.abs(y))move(x>0?1:-1);else if(y<0)hop();else duck()},{passive:true});function proj(x,y,z){const depth=z+5,scale=Math.min(W,H)*1.28/depth;return {x:W/2+x*scale,y:H*.44+(2.6-y)*scale,s:scale}}function poly(points,fill,stroke){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke()}}function quad(a,b,c,d,color){poly([a,b,c,d],color)}function cuboid(x,y,z,w,h,dep,front,side,top){const a=proj(x-w/2,y,z),b=proj(x+w/2,y,z),c=proj(x+w/2,y+h,z),d=proj(x-w/2,y+h,z),e=proj(x-w/2,y,z+dep),f=proj(x+w/2,y,z+dep),g=proj(x+w/2,y+h,z+dep),k=proj(x-w/2,y+h,z+dep);quad(d,c,g,k,top);quad(b,f,g,c,side);quad(a,b,c,d,front);return {a,b,c,d}}function background(t){const grad=ctx.createLinearGradient(0,0,0,H);grad.addColorStop(0,'#080c2c');grad.addColorStop(.5,'#24225c');grad.addColorStop(1,'#050a21');ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);ctx.fillStyle='#ff73c9';ctx.shadowBlur=35;ctx.shadowColor='#e85bff';ctx.beginPath();ctx.arc(W*.72,H*.26,Math.min(W,H)*.095,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;const horizon=H*.44;for(let i=0;i<27;i++){const bw=W/24,bx=i*bw-5,bh=(Math.sin(i*19.7)*.5+.5)*H*.18+H*.05;ctx.fillStyle=i%3?'#111636':'#1b1b46';ctx.fillRect(bx,horizon-bh,bw+1,bh);ctx.fillStyle='#2bd9ef77';for(let j=0;j<4;j++)for(let k=0;k<3;k++)if((i+j+k)%3===0)ctx.fillRect(bx+5+k*bw/4,horizon-bh+9+j*bh/5,2,4)}}function road(){const near=proj(0,0,1),far=proj(0,0,95);quad(proj(-4.5,0,1),proj(4.5,0,1),proj(4.5,0,95),proj(-4.5,0,95),'#171c3c');for(let i=-2;i<=2;i++){const x=i*1.45;const a=proj(x,0,1),b=proj(x,0,95);ctx.strokeStyle=i===-2||i===2?'#ff44c8':'#5e75b3';ctx.lineWidth=i===-2||i===2?4:1;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}for(let z=2-(dist%7);z<95;z+=7){for(const x of [-.73,.73]){quad(proj(x-.035,.01,z),proj(x+.035,.01,z),proj(x+.035,.01,z+2.4),proj(x-.035,.01,z+2.4),'#3fe6f5aa')}}for(let z=6-(dist%13);z<95;z+=13){for(const x of [-5.2,5.2]){cuboid(x,0,z,.22,3,.22,'#163e6a','#102c52','#65edff');const p=proj(x,3,z);ctx.fillStyle='#5df7ff';ctx.shadowColor='#5df7ff';ctx.shadowBlur=13;ctx.fillRect(p.x-5,p.y-3,10,5);ctx.shadowBlur=0}}}function coin(x,z,t){const p=proj(x,1.05+Math.sin(t*6+z)*.12,z);if(p.s<1)return;const r=p.s*.43;ctx.save();ctx.translate(p.x,p.y);ctx.scale(.7+Math.abs(Math.cos(t*4))*.3,1);ctx.shadowColor='#ffd34a';ctx.shadowBlur=15;ctx.fillStyle='#ffc93c';ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='#fff1a1';ctx.lineWidth=Math.max(1,r*.15);ctx.stroke();ctx.fillStyle='#fff0a0';ctx.font=`bold ${Math.max(8,r)}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('★',0,1);ctx.restore()}function player(t){const x=visualLane*1.45,z=4.8,y=jump;const s=slide>0?.6:1;const run=Math.sin(t*15)*.13;ctx.save();const anchor=proj(x,.05,z);const characterScale=.58;ctx.translate(anchor.x,anchor.y);ctx.scale(characterScale,characterScale);ctx.translate(-anchor.x,-anchor.y);ctx.shadowColor='#00dfff';ctx.shadowBlur=20;const p=proj(x,.05,z);ctx.fillStyle='#00f3ff55';ctx.beginPath();ctx.ellipse(p.x,p.y,p.s*.8,p.s*.22,0,0,7);ctx.fill();ctx.shadowBlur=0;cuboid(x-.23,y,z,.29,.8*s,.35,'#27377e','#141b52','#59e9fa');cuboid(x+.23,y,z,.29,.8*s,.35,'#27377e','#141b52','#59e9fa');cuboid(x,y+.65*s,z,.82,.95*s,.42,'#18c6e8','#176aa2','#9df9ff');cuboid(x-.54,y+.75*s+run,z,.24,.78*s,.3,'#ac4cff','#6e37b1','#f0baff');cuboid(x+.54,y+.75*s-run,z,.24,.78*s,.3,'#ac4cff','#6e37b1','#f0baff');cuboid(x,y+1.62*s,z,.64,.65*s,.55,'#f2b7a9','#ba7b91','#ffd2c0');cuboid(x,y+1.98*s,z,.72,.18,.57,'#25194f','#1a133e','#8d4cff');const eye=proj(x,y+1.82*s,z-.04);ctx.fillStyle='#071d42';ctx.fillRect(eye.x-eye.s*.22,eye.y-eye.s*.05,eye.s*.44,eye.s*.11);ctx.fillStyle='#57f5ff';ctx.fillRect(eye.x-eye.s*.18,eye.y-eye.s*.025,eye.s*.36,eye.s*.055);ctx.restore()}function obstacle(o){const x=o.lane*1.45,z=o.z;if(o.kind==='coin'){coin(x,z,dist/20);return}if(o.kind==='low'){cuboid(x,0,z,1.05,.9,.6,'#ff396b','#ad1d59','#ff8da5');const p=proj(x,.55,z);ctx.fillStyle='#fff';ctx.font=`bold ${Math.max(9,p.s*.28)}px sans-serif`;ctx.textAlign='center';ctx.fillText('▲',p.x,p.y)}else if(o.kind==='high'){cuboid(x-.53,0,z,.18,2.4,.35,'#7a40d9','#502890','#bc8aff');cuboid(x+.53,0,z,.18,2.4,.35,'#7a40d9','#502890','#bc8aff');cuboid(x,1.7,z,1.22,.65,.4,'#ff3fa8','#9e226d','#ff9be0')}else cuboid(x,0,z,1.1,2.2,.7,'#ff7a31','#a83b39','#ffd06d')}function spawnObjects(){const l=Math.floor(rand(0,3))-1;const kind=Math.random()<.42?'low':Math.random()<.56?'high':'wall';objects.push({lane:l,z:82,kind,hit:false});if(Math.random()<.75){const cl=l===-1?0:l===1?0:(Math.random()<.5?-1:1);for(let i=0;i<4;i++)objects.push({lane:cl,z:84+i*3.3,kind:'coin',hit:false})}}function crash(){state='over';shake=12;sound(110,.4,'sawtooth',.13);best=Math.max(best,Math.floor(score));localStorage.setItem('neonRush3dBest',best);updateHud();$('#overlay').classList.remove('hidden');$('#overlay').innerHTML=`<div class="card"><div class="logo">FIN DEL<br>RECORRIDO</div><h2>${Math.floor(score)} puntos</h2><p>🟡 ${coins} monedas recogidas<br>🏆 Récord: ${best}</p><button id="restart">↻ VOLVER A JUGAR</button><p style="font-size:12px">Próximamente: anuncios recompensados para continuar.</p></div>`;$('#restart').onclick=start}function update(dt){if(state!=='playing')return;speed=Math.min(43,20+dist/190);dist+=speed*dt;score+=speed*dt*.65;visualLane+=(lane-visualLane)*Math.min(1,dt*12);if(jump>0||vy>0){jump+=vy*dt;vy-=23*dt;if(jump<=0){jump=0;vy=0}}slide=Math.max(0,slide-dt);spawn-=dt;if(spawn<=0){spawnObjects();spawn=Math.max(.65,1.6-dist/1800)}for(const o of objects){o.z-=speed*dt;if(!o.hit&&o.z<6.4&&o.z>3.1&&o.lane===lane){o.hit=true;if(o.kind==='coin'){coins++;score+=25;sound(920,.1,'sine',.055)}else if(o.kind==='low'&&jump>1.05){}else if(o.kind==='high'&&slide>.05){}else{crash();break}}}objects=objects.filter(o=>o.z>1&&!o.hit);updateHud()}function frame(ms){const t=ms/1000,dt=Math.min(.04,(ms-last)/1000||.016);last=ms;update(dt);ctx.save();if(shake>0){ctx.translate(rand(-shake,shake),rand(-shake,shake));shake*=.82;if(shake<.2)shake=0}background(t);road();objects.sort((a,b)=>b.z-a.z);for(const o of objects)if(o.z>3)obstacle(o);player(t);ctx.restore();requestAnimationFrame(frame)}requestAnimationFrame(frame)})();
</script></body></html>
