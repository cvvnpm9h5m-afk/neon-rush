<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Neon Rush 3D v3.4 — Piedra Papel Tijeras</title><style>*{box-sizing:border-box}body{margin:0;background:#080b1f;color:white;font:16px system-ui;overflow:hidden;touch-action:none}canvas{display:block}#hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;text-shadow:0 2px 5px #000;pointer-events:none}#menu{position:fixed;inset:0;display:grid;place-items:center;background:#080a1ad9}#difficulty{display:flex;gap:7px;justify-content:center;margin:14px 0 18px}#difficulty button{padding:11px 12px;font-size:13px;background:#242849;color:#e4eaff;border:1px solid #5c6089;flex:1}#difficulty button.active{background:#4ee5f4;color:#071126;border-color:#fff;box-shadow:0 0 15px #4ee5f488}#card{background:#151632;border:1px solid #8a5bff;padding:28px;border-radius:20px;text-align:center;max-width:340px}h1{color:#5deaff;margin:0}button{border:0;border-radius:12px;background:#41dcf1;color:#071126;font-weight:bold;padding:14px 22px;font-size:17px}#controls{position:fixed;bottom:22px;left:15px;right:15px;display:flex;justify-content:space-between}#controls button{background:#233a6bc9;color:white;border:1px solid #66dfff;padding:14px}#controls div{display:flex;gap:8px}#roleHud{color:#7ef4ff;font-weight:900;transition:transform .18s,color .18s}#roleHud.pulse{transform:scale(1.25);color:#fff}#flash{position:fixed;inset:0;pointer-events:none;opacity:0;background:#fff;z-index:3}#level{position:fixed;top:88px;left:0;right:0;text-align:center;color:#ffd68c;font-size:12px;font-weight:800;pointer-events:none;text-shadow:0 2px 6px #000}#toast{position:fixed;top:20%;left:0;right:0;text-align:center;font-size:28px;font-weight:900;pointer-events:none;text-shadow:0 3px 8px #000;opacity:0;transition:opacity .2s}#legend{position:fixed;top:62px;left:0;right:0;text-align:center;font-size:13px;color:#c9caff;pointer-events:none}small{color:#b8b8df}</style></head><body><div id="hud"><span>PUNTOS <b id="score">0</b></span><span id="roleHud">ROL: ✊ PIEDRA</span><span>RÉCORD <b id="best">0</b></span></div><div id="legend">✊ &gt; ✌️ &nbsp; ✋ &gt; ✊ &nbsp; ✌️ &gt; ✋</div><div id="level">NIVEL 1 · VELOCIDAD 1×</div><div id="flash"></div><div id="toast"></div><div id="controls"><div><button id="left">◀</button><button id="right">▶</button></div><div><button id="down">▼</button><button id="up">▲</button></div></div><div id="menu"><div id="card"><h1>NEON RUSH 3D</h1><h3>Versión 3.4 · Piedra, papel y tijeras</h3><p id="message">Cargando personaje 3D…</p><div style="font-size:13px;font-weight:700">ELIGE LA DIFICULTAD</div><div id="difficulty"><button type="button" data-mode="easy">🟢 FÁCIL</button><button type="button" data-mode="normal" class="active">🟡 NORMAL</button><button type="button" data-mode="hard">🔴 DIFÍCIL</button></div><button id="play">JUGAR</button><p><small>✊ vence ✌️ · ✋ vence ✊ · ✌️ vence ✋</small></p><p><small>Cada fila tiene ✊ ✋ ✌️. Elige el carril que gana. Empatar cambia tu rol.</small></p></div></div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script><script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const $=x=>document.querySelector(x), scene=new THREE.Scene();scene.background=new THREE.Color(0x090b23);scene.fog=new THREE.FogExp2(0x090b23,.013);
const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,250);camera.position.set(0,4.3,10.6);camera.lookAt(0,1.2,-15);
const renderer=new THREE.WebGLRenderer({antialias:true, powerPreference:"high-performance"});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0x9bcaff,0x19102e,2));const light=new THREE.DirectionalLight(0xffd1ee,2.5);light.position.set(-4,9,7);scene.add(light);
const road=new THREE.Mesh(new THREE.BoxGeometry(10,.15,260),new THREE.MeshStandardMaterial({color:0x111b38,roughness:.6}));road.position.z=-105;road.position.y=-.12;scene.add(road);
const laneWidth=2.7;for(let i=-1;i<=1;i++){const edge=new THREE.Mesh(new THREE.BoxGeometry(.07,.035,260),new THREE.MeshBasicMaterial({color:i===0?0x445588:0xff33a9}));edge.position.set(i===0?0:Math.sign(i)*4.9,.01,-105);scene.add(edge)}
let marks=[];for(let z=-180;z<12;z+=8)for(let x of [-laneWidth/2,laneWidth/2]){const m=new THREE.Mesh(new THREE.BoxGeometry(.07,.02,3),new THREE.MeshBasicMaterial({color:0x59edff}));m.position.set(x,.03,z);scene.add(m);marks.push(m)}
let buildings=[];for(let i=0;i<85;i++){let side=i%2?-1:1,z=-i*3.3;let h=3+(i*17%9);const m=new THREE.Mesh(new THREE.BoxGeometry(2.5,h,2.5),new THREE.MeshStandardMaterial({color:i%3?0x1c2353:0x331c55,emissive:i%4?0x080c21:0x200928}));m.position.set(side*(8+(i%3)*2),h/2-.2,z);scene.add(m);buildings.push(m)}
const player=new THREE.Group();player.position.set(0,0,2);scene.add(player);let mixer=null,hero=null,ready=false;
// The game is playable even if the external GLB cannot be loaded.
function fallbackHero(){
 const group=new THREE.Group();
 const mat=new THREE.MeshStandardMaterial({color:0xd94985,roughness:.65});
 const torso=new THREE.Mesh(new THREE.CapsuleGeometry(.28,.85,5,12),mat);
 torso.position.y=1.25;group.add(torso);
 const head=new THREE.Mesh(new THREE.SphereGeometry(.27,16,12),new THREE.MeshStandardMaterial({color:0xf2b4a8}));
 head.position.y=2.2;group.add(head);
 const hair=new THREE.Mesh(new THREE.CapsuleGeometry(.3,.85,5,12),mat);hair.position.set(0,1.85,.22);group.add(hair);
 for(const x of [-.16,.16]){const leg=new THREE.Mesh(new THREE.CapsuleGeometry(.11,.68,4,10),new THREE.MeshStandardMaterial({color:0xddd2e5}));leg.position.set(x,.55,0);group.add(leg)}
 return group;
}
function setReady(message){
 ready=true;$('#message').textContent=message;
 $('#play').disabled=false;$('#play').style.opacity='1';$('#play').textContent='JUGAR';
}
const loader=new GLTFLoader();
loader.load('./heroine.glb?v=33',g=>{
 if(ready)return;try {
  hero=g.scene;hero.scale.setScalar(.95);hero.rotation.y=0;player.add(hero);
  if(g.animations.length){mixer=new THREE.AnimationMixer(hero);mixer.clipAction(g.animations[0]).play()}
  setReady('Heroína 3D cargada · ¡Lista para jugar!');
 }catch(err){console.error(err);hero=fallbackHero();player.add(hero);setReady('Modo alternativo: error de modelo 3D')}
},undefined,e=>{
 if(ready)return;console.error('GLB:',e);hero=fallbackHero();player.add(hero);
 setReady('Modo alternativo: no se pudo cargar heroine.glb');
});
setTimeout(()=>{if(!ready){hero=fallbackHero();player.add(hero);setReady('Modo alternativo: carga demasiado lenta')}},12000);

const SIGNS=[{name:'PIEDRA',emoji:'✊',color:0xff985c},{name:'PAPEL',emoji:'✋',color:0x55e7d1},{name:'TIJERAS',emoji:'✌️',color:0xc58cff}];
const winsAgainst=[2,0,1]; // piedra > tijeras, papel > piedra, tijeras > papel
const MODES={easy:{label:'FÁCIL',initial:17,growth:.13,cap:36},normal:{label:'NORMAL',initial:22,growth:.18,cap:43},hard:{label:'DIFÍCIL',initial:28,growth:.23,cap:50}};
let mode='normal';try{const saved=localStorage.getItem('neonRpsDifficulty');if(MODES[saved])mode=saved}catch(e){}
function updateDifficulty(){document.querySelectorAll('#difficulty button').forEach(b=>{b.classList.toggle('active',b.dataset.mode===mode);b.setAttribute('aria-pressed',String(b.dataset.mode===mode))})}
document.querySelectorAll('#difficulty button').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.mode;try{localStorage.setItem('neonRpsDifficulty',mode)}catch(e){}updateDifficulty()}));updateDifficulty();
let playing=false,lane=0,score=0,best=Number((()=>{try{return localStorage.getItem('neonBestRps3d')}catch(e){return 0}})()||0),speed=18,elapsed=0,spawn=.8,items=[],jump=0,vel=0,slide=0,prev=performance.now(),role=0,toastTime=0,particles=[],flashTime=0,level=1,waves=0;$('#best').textContent=best;
function setRole(r){role=r;const h=$('#roleHud');h.textContent='ROL: '+SIGNS[r].emoji+' '+SIGNS[r].name;h.classList.remove('pulse');void h.offsetWidth;h.classList.add('pulse');setTimeout(()=>h.classList.remove('pulse'),350);}
function toast(s,color='#fff'){const t=$('#toast');t.textContent=s;t.style.color=color;t.style.opacity='1';toastTime=1.15;}
function makeSignTexture(r){const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d');x.fillStyle='#15132d';x.beginPath();if(x.roundRect)x.roundRect(12,12,232,232,44);else x.rect(12,12,232,232);x.fill();x.strokeStyle='#'+SIGNS[r].color.toString(16).padStart(6,'0');x.lineWidth=12;x.stroke();x.font='140px "Apple Color Emoji","Segoe UI Emoji",sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(SIGNS[r].emoji,128,126);x.fillStyle='#fff';x.font='bold 22px system-ui';x.fillText(SIGNS[r].name,128,222);const tx=new THREE.CanvasTexture(c);tx.colorSpace=THREE.SRGBColorSpace;return tx;}
const signMaterials=SIGNS.map((_,r)=>new THREE.MeshBasicMaterial({map:makeSignTexture(r),side:THREE.DoubleSide,transparent:true}));
function start(){if(!ready){$('#message').textContent='Cargando el modelo. Espera unos segundos…';return;}items.forEach(i=>scene.remove(i.mesh));items=[];particles.forEach(p=>scene.remove(p.mesh));particles=[];lane=0;score=elapsed=jump=vel=slide=0;waves=0;level=1;flashTime=0;$('#flash').style.opacity='0';$('#level').textContent='NIVEL 1 · '+MODES[mode].label+' · VELOCIDAD 1.0×';$('#score').textContent='0';setRole(Math.floor(Math.random()*3));speed=MODES[mode].initial;spawn=1.1;playing=true;$('#menu').style.display='none';$('#toast').style.opacity='0';player.position.set(0,0,2);hero.scale.y=.95}
function move(n){if(playing)lane=Math.max(-1,Math.min(1,lane+n))}function up(){if(playing&&jump===0&&slide===0)vel=9}function down(){if(playing&&jump===0)slide=.75}
$('#play').onclick=start;$('#left').onclick=()=>move(-1);$('#right').onclick=()=>move(1);$('#up').onclick=up;$('#down').onclick=down;
addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft'||e.key==='a')move(-1);if(e.key==='ArrowRight'||e.key==='d')move(1);if(e.key==='ArrowUp'||e.key===' ')up();if(e.key==='ArrowDown')down();if(e.key==='Enter'&&!playing)start()});let sx,sy;renderer.domElement.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});renderer.domElement.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<25)return;if(Math.abs(dx)>Math.abs(dy))move(Math.sign(dx));else dy<0?up():down()},{passive:true});
// Every wave contains all three symbols: exactly one win, one tie and one loss.
function create(){
 const order=[0,1,2];for(let i=2;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}
 const z=-105;waves++;
 for(let i=0;i<3;i++){
  const l=i-1,r=order[i],mesh=new THREE.Mesh(new THREE.PlaneGeometry(1.7,1.7),signMaterials[r]);
  mesh.position.set(l*laneWidth,1.65,z);scene.add(mesh);items.push({mesh,l,r,hit:false,wave:waves});
 }
}
function burst(x,y,z,color,count=22){
 const material=new THREE.MeshBasicMaterial({color,transparent:true,opacity:1,depthWrite:false});
 for(let i=0;i<count;i++){
  const mesh=new THREE.Mesh(new THREE.BoxGeometry(.09,.09,.09),material.clone());
  mesh.position.set(x,y,z);scene.add(mesh);
  particles.push({mesh,vx:(Math.random()-.5)*9,vy:Math.random()*6+1,vz:(Math.random()-.5)*6,life:.7+Math.random()*.5,max:1.2});
 }
}
function flash(color){const f=$('#flash');f.style.background=color;flashTime=.2;f.style.opacity='.3'}
function lose(){playing=false;best=Math.max(best,score);try{localStorage.setItem('neonBestRps3d',best)}catch(e){}$('#best').textContent=best;$('#message').textContent=`${score} puntos · Tu rol era ${SIGNS[role].name}`;$('#play').textContent='VOLVER A JUGAR';$('#menu').style.display='grid';flash('#ff174d');burst(player.position.x,1.5,2,0xff376b,36)}
function resolve(r){
 if(r===role){let options=[0,1,2].filter(x=>x!==role);setRole(options[Math.floor(Math.random()*2)]);toast('¡EMPATE! NUEVO ROL: '+SIGNS[role].emoji,'#80eaff');flash('#42dfff');burst(player.position.x,1.7,2,0x4be8ff,24);}
 else if(r===winsAgainst[role]){score+=100;toast('¡GANASTE! +100','#83ff9e');flash('#56ff8c');burst(player.position.x,1.7,2,0x68ffab,28);}
 else {toast('¡PERDISTE!','#ff688e');lose();}
}
function tick(now){requestAnimationFrame(tick);let dt=Math.min(.05,(now-prev)/1000);prev=now;
 if(toastTime>0){toastTime-=dt;if(toastTime<=0)$('#toast').style.opacity='0'}
 if(flashTime>0){flashTime-=dt;$('#flash').style.opacity=String(Math.max(0,flashTime/.2*.3))}for(const p of particles){p.life-=dt;p.mesh.position.x+=p.vx*dt;p.mesh.position.y+=p.vy*dt;p.mesh.position.z+=p.vz*dt;p.vy-=12*dt;p.mesh.material.opacity=Math.max(0,p.life/p.max)}particles=particles.filter(p=>{if(p.life<=0){scene.remove(p.mesh);p.mesh.material.dispose();p.mesh.geometry.dispose();return false}return true});if(mixer&&playing)mixer.update(dt*1.5);
 if(playing){elapsed+=dt;level=Math.min(12,1+Math.floor(elapsed/20));const setting=MODES[mode];speed=Math.min(setting.cap,setting.initial+elapsed*setting.growth);$('#level').textContent='NIVEL '+level+' · '+setting.label+' · VELOCIDAD '+(speed/17).toFixed(1)+'×';spawn-=dt;if(spawn<=0){create();spawn=Math.max(2.3,105/speed)}
 player.position.x+=(lane*laneWidth-player.position.x)*Math.min(1,dt*16);
 if(jump>0||vel>0){jump+=vel*dt;vel-=23*dt;if(jump<0){jump=0;vel=0}}
 player.position.y=jump;slide=Math.max(0,slide-dt);if(hero)hero.scale.y=slide>0?.62:.95;
 for(const m of marks){m.position.z+=speed*dt;if(m.position.z>12)m.position.z-=192}
 for(const o of items){o.mesh.position.z+=speed*dt;
 if(!o.hit&&o.mesh.position.z>1&&o.mesh.position.z<3.1&&o.l===lane){const w=o.wave;for(const q of items){if(q.wave===w){q.hit=true;scene.remove(q.mesh)}}resolve(o.r);if(!playing)break}
 }
 items=items.filter(o=>{if(o.hit||o.mesh.position.z>15){scene.remove(o.mesh);return false}return true});$('#score').textContent=score;
 }
 renderer.render(scene,camera)}requestAnimationFrame(tick);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
