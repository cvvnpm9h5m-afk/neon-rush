<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#090b20"><meta name="apple-mobile-web-app-capable" content="yes"><title>Neon Rush</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b20;color:white;font-family:system-ui,-apple-system,sans-serif;touch-action:none}canvas{display:block;width:100%;height:100%}#hud{position:absolute;top:env(safe-area-inset-top);left:0;right:0;display:flex;justify-content:space-between;padding:16px;pointer-events:none;text-shadow:0 2px 8px #000;font-weight:800}#hud span{font-size:12px;color:#b5c6ff}#hud strong{font-size:23px}#panel{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#090c21bb,#090c21e8);padding:20px}#card{width:min(92vw,400px);border:1px solid #5667b7;border-radius:25px;background:#121935ee;padding:26px;text-align:center;box-shadow:0 0 50px #744bff40}h1{font-size:42px;line-height:1;margin:4px 0 10px;color:#68faff;text-shadow:0 0 22px #1bcfe6}p{color:#d6dcff;line-height:1.5}button{border:0;border-radius:15px;padding:15px 18px;background:linear-gradient(100deg,#21d9ec,#8a5bff);color:#07112b;font-size:17px;font-weight:900;width:100%;margin-top:12px}button.secondary{background:#29355f;color:white}.tiny{font-size:12px;color:#aab8e0}#controls{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom));left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none}#controls button{width:29%;max-width:125px;pointer-events:auto;opacity:.65;margin:0;font-size:22px;padding:12px}#pause{position:absolute;right:16px;top:calc(78px + env(safe-area-inset-top));width:auto;padding:9px 14px;background:#202b50cc;color:white;margin:0}#panel[hidden],#controls[hidden],#pause[hidden]{display:none}</style></head><body><canvas id="game"></canvas><div id="hud"><div><span>PUNTOS</span><br><strong id="score">0</strong></div><div style="text-align:center"><span>MONEDAS</span><br><strong id="coins">0</strong></div><div style="text-align:right"><span>RÉCORD</span><br><strong id="best">0</strong></div></div><button id="pause" hidden>Ⅱ</button><div id="controls" hidden><button id="left">◀</button><button id="jump">▲</button><button id="right">▶</button></div><div id="panel"><div id="card"><h1>NEON RUSH</h1><p id="message">Corre por una ciudad de neón, esquiva los obstáculos y recoge monedas.</p><button id="start">▶ JUGAR</button><button class="secondary" id="sound">🔊 Sonido: activado</button><p class="tiny">Desliza a los lados para cambiar de carril y hacia arriba para saltar. También puedes usar los botones.</p><p class="tiny" id="stats"></p></div></div><script>
(()=>{'use strict';const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');let W=0,H=0,dpr=1,mode='menu',lane=1,jump=0,vy=0,score=0,coins=0,objects=[],spawn=0,speed=340,last=0,world=0,muted=false,session=0;const $=id=>document.getElementById(id);const key='neonrush_v1';let saved={best:0,totalCoins:0,games:0};try{saved={...saved,...JSON.parse(localStorage.getItem(key)||'{}')}}catch(e){}function save(){try{localStorage.setItem(key,JSON.stringify(saved))}catch(e){}}function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();let audio;function beep(f=440,d=.1,type='sine',vol=.08){if(muted)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(f,audio.currentTime);g.gain.setValueAtTime(vol,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch(e){}}function ui(){ $('score').textContent=Math.floor(score);$('coins').textContent=coins;$('best').textContent=saved.best;$('pause').hidden=mode!=='play';$('controls').hidden=mode!=='play'}function start(){mode='play';lane=1;jump=0;vy=0;score=0;coins=0;objects=[];spawn=.6;speed=340;world=0;session++;$('panel').hidden=true;ui();beep(660,.12)}function end(){mode='over';saved.best=Math.max(saved.best,Math.floor(score));saved.totalCoins+=coins;saved.games++;save();$('panel').hidden=false;$('message').innerHTML=`¡Fin de la carrera!<br><b>${Math.floor(score)} puntos · ${coins} monedas</b>`;$('start').textContent='↻ VOLVER A JUGAR';$('stats').textContent=`Récord: ${saved.best} · Monedas acumuladas: ${saved.totalCoins}`;ui();beep(160,.45,'sawtooth',.06)}function move(n){if(mode!=='play')return;lane=Math.max(0,Math.min(2,lane+n));beep(340+lane*110,.065)}function leap(){if(mode==='play'&&jump===0){vy=720;beep(720,.15,'triangle')}}$('start').onclick=start;$('left').onclick=()=>move(-1);$('right').onclick=()=>move(1);$('jump').onclick=leap;$('sound').onclick=()=>{muted=!muted;$('sound').textContent=muted?'🔇 Sonido: desactivado':'🔊 Sonido: activado';if(!muted)beep()};$('pause').onclick=()=>{mode='paused';$('panel').hidden=false;$('message').textContent='Juego en pausa';$('start').textContent='▶ CONTINUAR';$('start').onclick=()=>{mode='play';$('panel').hidden=true;ui()};ui()};function restartButton(){if(mode!=='paused')$('start').onclick=start}let sx=0,sy=0;canvas.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY});canvas.addEventListener('pointerup',e=>{const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)>35&&Math.abs(dx)>Math.abs(dy))move(dx>0?1:-1);else if(dy< -25||Math.abs(dx)<20)leap()});addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp',' ','a','d','w'].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft'||e.key==='a')move(-1);if(e.key==='ArrowRight'||e.key==='d')move(1);if(['ArrowUp',' ','w'].includes(e.key))leap();if(e.key==='Enter'&&mode!=='play'){if(mode==='paused'){$('start').click()}else start()}});function laneX(l,z){const t=1-z;return W/2+(l-1)*W*.255*(.18+.82*t)}function yAt(z){return H*.28+(1-z)*(H*.67)}function scaleAt(z){return .18+(1-z)*1.3}function draw(){let bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#080d30');bg.addColorStop(.7,'#291451');bg.addColorStop(1,'#070b24');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);ctx.fillStyle='#ff65ce';ctx.beginPath();ctx.arc(W*.5,H*.22,Math.min(W*.14,65),0,Math.PI*2);ctx.fill();ctx.fillStyle='#0a1130';for(let i=0;i<22;i++){let x=i*W/21,h=40+(i*43%115);ctx.fillRect(x,H*.31-h,Math.max(12,W/26),h+30);ctx.fillStyle='#54e8ff';for(let k=0;k<4;k++)ctx.fillRect(x+4,H*.31-h+8+k*17,3,5);ctx.fillStyle='#0a1130'}ctx.fillStyle='#111932';ctx.beginPath();ctx.moveTo(W*.43,H*.28);ctx.lineTo(W*.57,H*.28);ctx.lineTo(W*1.1,H);ctx.lineTo(-W*.1,H);ctx.closePath();ctx.fill();ctx.strokeStyle='#3bdbf6';ctx.lineWidth=3;for(let l of [-.5,.5]){ctx.beginPath();ctx.moveTo(W/2+l*W*.06,H*.28);ctx.lineTo(W/2+l*W*.255,H);ctx.stroke()}ctx.strokeStyle='#ffffff55';ctx.lineWidth=2;for(let k=0;k<12;k++){let z=((k/12+world*.0015)%1),y=yAt(z);ctx.beginPath();ctx.moveTo(W/2-W*.42*(1-z),y);ctx.lineTo(W/2+W*.42*(1-z),y);ctx.stroke()}objects.sort((a,b)=>b.z-a.z);for(const o of objects){const x=laneX(o.lane,o.z),y=yAt(o.z),s=scaleAt(o.z);if(o.type==='coin'){ctx.save();ctx.translate(x,y-35*s);ctx.scale(s,s);ctx.fillStyle='#ffd74d';ctx.shadowColor='#ffb900';ctx.shadowBlur=20;ctx.beginPath();ctx.ellipse(0,0,14,18,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff3b0';ctx.font='bold 21px sans-serif';ctx.textAlign='center';ctx.fillText('★',0,7);ctx.restore()}else{ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle='#ff397a';ctx.shadowColor='#ff397a';ctx.shadowBlur=15;ctx.fillRect(-24,-49,48,49);ctx.fillStyle='#ffbbdc';ctx.fillRect(-18,-42,36,8);ctx.restore()}}const px=laneX(lane,0),py=H*.88-jump;ctx.save();ctx.translate(px,py);ctx.shadowBlur=25;ctx.shadowColor='#26f6fc';ctx.fillStyle='#0cddf2';ctx.beginPath();ctx.roundRect(-19,-48,38,48,10);ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(-12,-37,24,9);ctx.fillStyle='#a55cff';ctx.fillRect(-17,-3,13,13);ctx.fillRect(5,-3,13,13);ctx.restore();if(mode==='menu'){ctx.fillStyle='#ffffff22';ctx.font='bold 18px sans-serif';ctx.textAlign='center';ctx.fillText('3 CARRILES · SALTA · SOBREVIVE',W/2,H*.42)}}function update(dt){if(mode!=='play')return;world+=speed*dt;speed=Math.min(820,speed+dt*4);score+=dt*speed*.075;if(jump>0||vy>0){jump+=vy*dt;vy-=1900*dt;if(jump<=0){jump=0;vy=0}}spawn-=dt;if(spawn<=0){const l=Math.floor(Math.random()*3);objects.push({lane:l,z:1,type:Math.random()<.38?'coin':'block',hit:false});if(Math.random()<.3)objects.push({lane:(l+1+Math.floor(Math.random()*2))%3,z:1.18,type:'coin',hit:false});spawn=Math.max(.42,.88-speed/1700)}for(const o of objects){o.z-=speed*dt/950;if(!o.hit&&o.z<.12&&o.z>-.08&&o.lane===lane){o.hit=true;if(o.type==='coin'){coins++;score+=25;beep(960,.12,'sine',.1)}else if(jump<50){end();restartButton();break}}}objects=objects.filter(o=>o.z>-.2);ui()}function frame(t){const dt=Math.min((t-last)/1000||0,.05);last=t;update(dt);draw();requestAnimationFrame(frame)}ui();requestAnimationFrame(frame);})();
</script></body></html>
